[package]
name = "interview_rust_project"
version = "0.1.0"
edition = "2024"

[dependencies]
# 只用了关于epoll的
libc = "0.2.169"
# 只用了无锁数据结构
crossbeam = "0.8.4"
lazy_static = "1.5.0"
socket2 = "0.5.8"
# rand = "0.9.0"
fxhash = "0.2.1"
proc_macro = { path = "./crates/proc_macro" }

# 只在启动一个服务中使用 (用来测试SyncTcpStream)
tokio = { version = "1.43.0", features = ["full"] }

[workspace]
members = ["crates/*"]
